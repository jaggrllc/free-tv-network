name: Refresh channels.json

on:
  schedule:
    # Runs every Sunday at 06:00 UTC (adjust cron as needed)
    - cron: '0 6 * * 0'
  workflow_dispatch:   # Allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install internetarchive
        run: pip install internetarchive

      - name: Run channel builder
        run: python build_tv.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels.json
          git diff --staged --quiet || git commit -m "Auto-refresh channels.json [skip ci]"
          git push
