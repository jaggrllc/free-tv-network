.github/workflows/generate-channels.yml

name: Generate channels.json

on:
  workflow_dispatch:   # Lets you start it manually from the GitHub website

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed so it can commit the JSON file

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install internetarchive requests

      - name: Run generator
        run: python generate_channels.py

      - name: Commit channels.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels.json
          git commit -m "Update channels.json" || echo "No changes"
          git push
